name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app_src/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project and add our app
        run: |
          flutter create build_app \
            --platforms=android \
            --project-name signal_bot \
            --org com.signalbot

          cp app_src/main.dart build_app/lib/main.dart
          cp app_src/pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/test

          M=build_app/android/app/src/main/AndroidManifest.xml

          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$M"

          sed -i 's#android:label="[^"]*"#android:label="Signal Bot"#' "$M"

      - name: Enable core library desugaring
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          kts = Path("build_app/android/app/build.gradle.kts")
          groovy = Path("build_app/android/app/build.gradle")

          if kts.exists():
              path = kts
              content = path.read_text()

              if "isCoreLibraryDesugaringEnabled = true" not in content:
                  content, count = re.subn(
                      r"compileOptions\s*\{",
                      lambda m: m.group(0)
                      + "\n        isCoreLibraryDesugaringEnabled = true",
                      content,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit(
                          "Could not find compileOptions in build.gradle.kts"
                      )

              dependency = (
                  'coreLibraryDesugaring('
                  '"com.android.tools:desugar_jdk_libs:2.1.4")'
              )

              if "coreLibraryDesugaring(" not in content:
                  match = re.search(r"dependencies\s*\{", content)

                  if match:
                      content = (
                          content[:match.end()]
                          + "\n    "
                          + dependency
                          + content[match.end():]
                      )
                  else:
                      content += (
                          "\n\ndependencies {\n    "
                          + dependency
                          + "\n}\n"
                      )

              path.write_text(content)

          elif groovy.exists():
              path = groovy
              content = path.read_text()

              if "coreLibraryDesugaringEnabled true" not in content:
                  content, count = re.subn(
                      r"compileOptions\s*\{",
                      lambda m: m.group(0)
                      + "\n        coreLibraryDesugaringEnabled true",
                      content,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit(
                          "Could not find compileOptions in build.gradle"
                      )

              dependency = (
                  "coreLibraryDesugaring "
                  "'com.android.tools:desugar_jdk_libs:2.1.4'"
              )

              if "coreLibraryDesugaring '" not in content:
                  match = re.search(r"dependencies\s*\{", content)

                  if match:
                      content = (
                          content[:match.end()]
                          + "\n    "
                          + dependency
                          + content[match.end():]
                      )
                  else:
                      content += (
                          "\n\ndependencies {\n    "
                          + dependency
                          + "\n}\n"
                      )

              path.write_text(content)

          else:
              raise SystemExit("No Android app Gradle file found")

          print(f"Configured desugaring in {path}")
          PYCODE

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get

          flutter build apk --release \
            --dart-define=FEED_URL=https://raw.githubusercontent.com/zeesshhhh/Ok/main/docs/feed.json

      - uses: actions/upload-artifact@v4
        with:
          name: signal-bot
          path: build_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build_app/build/app/outputs/flutter-apk/app-release.apk signal-bot.apk

          gh release create "apk-${{ github.run_number }}" \
            signal-bot.apk \
            --title "Signal Bot APK #${{ github.run_number }}" \
            --notes "Download signal-bot.apk on your phone and install it."
