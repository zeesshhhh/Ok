name: Signal bot

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 6 * * *"
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: scan, report, invest or backtest
        type: choice
        options:
          - scan
          - report
          - invest
          - backtest
        default: scan

permissions:
  contents: write

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            state.json
            paper.json
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Run signal bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPY_SOURCE_URL: ${{ secrets.COPY_SOURCE_URL }}
        run: |
          SCHED="${{ github.event.schedule }}"
          MODE="${{ inputs.mode }}"

          if [ -z "$MODE" ]; then
            case "$SCHED" in
              "0 6 * * *") MODE=report ;;
              "0 7 * * 1") MODE=invest ;;
              *) MODE=scan ;;
            esac
          fi

          if [ "$MODE" = "backtest" ]; then
            python backtest.py
          else
            python main.py "$MODE"
          fi

      - name: Publish feed for Android
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add docs/feed.json || true

          if ! git diff --cached --quiet; then
            git commit -m "update feed"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: backtest_results.txt
          if-no-files-found: ignore
